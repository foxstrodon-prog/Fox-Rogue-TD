name: Automated GitHub Release & APK Upload

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag override (e.g., v0.0.0.007) - leave empty to auto-detect from app/build.gradle.kts'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release on Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_VER="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            GRADLE_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            RAW_VER="v${GRADLE_VER}"
          fi

          # Ensure leading 'v'
          if [[ ! "$RAW_VER" =~ ^v ]]; then
            RELEASE_TAG="v${RAW_VER}"
          else
            RELEASE_TAG="${RAW_VER}"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: ${RELEASE_TAG}"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Stage Release Binaries
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          mkdir -p dist

          # 1. Primary named asset: game-release-vX.X.X.XXX.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/game-release-${TAG}.apk"

          # 2. Project standard debug apk: RogueTD-vX.X.X.XXX-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/RogueTD-${TAG}-debug.apk"

          # 3. Include Windows executable runner if present
          if [ -f "${TAG}.exe" ]; then
            cp "${TAG}.exe" "dist/RogueTD-${TAG}.exe"
          elif [ -f "apk/${TAG}.exe" ]; then
            cp "apk/${TAG}.exe" "dist/RogueTD-${TAG}.exe"
          fi

          echo "Staged release distribution assets:"
          ls -lh dist

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: RogueTD-${{ steps.version_step.outputs.tag }}-assets
          path: dist/*

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_step.outputs.tag }}
        run: |
          echo "Checking if GitHub Release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release target and uploading latest assets with --clobber..."
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Rogue TD: Dual-Front $TAG" \
              --generate-notes
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Rogue TD: Dual-Front $TAG" \
              --generate-notes
          fi
          echo "Successfully published release $TAG for commit $GITHUB_SHA!"

name: Automated GitHub Release & APK Upload

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag override (e.g., v0.0.0.007) - leave empty to auto-detect from app/build.gradle.kts'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release on Commit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine Version Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_VER="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            GRADLE_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            RAW_VER="v${GRADLE_VER}"
          fi

          # Ensure leading 'v'
          if [[ ! "$RAW_VER" =~ ^v ]]; then
            RELEASE_TAG="v${RAW_VER}"
          else
            RELEASE_TAG="${RAW_VER}"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: ${RELEASE_TAG}"

      - name: Run Unit Tests
        env:
          LEADERBOARD_PROJECT_ID: ${{ secrets.LEADERBOARD_PROJECT_ID }}
          LEADERBOARD_API_KEY: ${{ secrets.LEADERBOARD_API_KEY }}
          LEADERBOARD_COLLECTION: ${{ secrets.LEADERBOARD_COLLECTION }}
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        env:
          LEADERBOARD_PROJECT_ID: ${{ secrets.LEADERBOARD_PROJECT_ID }}
          LEADERBOARD_API_KEY: ${{ secrets.LEADERBOARD_API_KEY }}
          LEADERBOARD_COLLECTION: ${{ secrets.LEADERBOARD_COLLECTION }}
        run: ./gradlew assembleDebug

      - name: Stage Release Binaries
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          mkdir -p dist

          # 1. Primary named asset: Dual-Front-TD-vX.X.X.XXX-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Dual-Front-TD-${TAG}-debug.apk"

          # 2. Compatibility alias: game-release-vX.X.X.XXX.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/game-release-${TAG}.apk"

          # 3. Legacy alias: RogueTD-vX.X.X.XXX-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist/RogueTD-${TAG}-debug.apk"

          # 4. Include Windows executable runners if present
          if [ -f "Dual Front TD.exe" ]; then
            cp "Dual Front TD.exe" "dist/Dual Front TD.exe"
            cp "Dual Front TD.exe" "dist/Dual-Front-TD-${TAG}.exe"
          fi
          if [ -f "apk/Dual-Front-TD-${TAG}.exe" ]; then
            cp "apk/Dual-Front-TD-${TAG}.exe" "dist/Dual-Front-TD-${TAG}.exe"
          fi

          echo "Staged release distribution assets:"
          ls -lh dist

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Dual-Front-TD-${{ steps.version_step.outputs.tag }}-assets
          path: dist/*

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_step.outputs.tag }}
        run: |
          echo "Checking if GitHub Release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release target and uploading latest assets with --clobber..."
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Dual Front TD $TAG" \
              --generate-notes || true
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Dual Front TD $TAG" \
              --generate-notes || {
                echo "Release creation encountered existing tag or conflict; uploading assets with --clobber..."
                gh release upload "$TAG" dist/* --clobber
              }
          fi
          echo "Successfully published or updated release $TAG for commit $GITHUB_SHA!"

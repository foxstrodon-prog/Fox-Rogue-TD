name: Automated GitHub Release & APK Upload

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag override (e.g., v0.0.1.020) - leave empty to auto-detect from app/build.gradle.kts'
        required: false
        default: ''
      publish_release:
        description: 'Set to true ONLY when explicitly commanded to publish the release live (otherwise creates/updates a Draft Release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Stage Draft Release (Publish Only on Explicit Release Tag/Command)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine Version Tag & Release Mode
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_VER="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            GRADLE_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            RAW_VER="v${GRADLE_VER}"
          fi

          # Ensure leading 'v'
          if [[ ! "$RAW_VER" =~ ^v ]]; then
            RELEASE_TAG="v${RAW_VER}"
          else
            RELEASE_TAG="${RAW_VER}"
          fi

          # Draft by default on every branch push; publish live ONLY on explicit tag push (refs/tags/v*) or publish_release=true
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ "${{ github.event.inputs.publish_release }}" == "true" ]]; then
            IS_DRAFT="false"
          else
            IS_DRAFT="true"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${IS_DRAFT}" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: ${RELEASE_TAG} (Draft Mode: ${IS_DRAFT})"

      - name: Restore Canonical Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > debug.keystore
          cp debug.keystore ~/.android/debug.keystore

      - name: Run Unit Tests
        env:
          LEADERBOARD_PROJECT_ID: ${{ secrets.LEADERBOARD_PROJECT_ID }}
          LEADERBOARD_API_KEY: ${{ secrets.LEADERBOARD_API_KEY }}
          LEADERBOARD_COLLECTION: ${{ secrets.LEADERBOARD_COLLECTION }}
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        env:
          LEADERBOARD_PROJECT_ID: ${{ secrets.LEADERBOARD_PROJECT_ID }}
          LEADERBOARD_API_KEY: ${{ secrets.LEADERBOARD_API_KEY }}
          LEADERBOARD_COLLECTION: ${{ secrets.LEADERBOARD_COLLECTION }}
        run: ./gradlew assembleDebug

      - name: Stage Release Binaries
        run: |
          TAG="${{ steps.version_step.outputs.tag }}"
          mkdir -p dist

          # Strictly stage ONLY the official Android APK for release distribution
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Dual-Front-TD-${TAG}-debug.apk"

          echo "Staged release distribution assets (APK only):"
          ls -lh dist

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Dual-Front-TD-${{ steps.version_step.outputs.tag }}-assets
          path: dist/*

      - name: Stage Draft Release or Publish on Command
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_step.outputs.tag }}
          IS_DRAFT: ${{ steps.version_step.outputs.is_draft }}
        run: |
          echo "Checking if GitHub Release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading latest assets with --clobber..."
            gh release upload "$TAG" dist/* --clobber
            if [ "$IS_DRAFT" = "false" ]; then
              echo "Explicit release command/tag detected: publishing release $TAG live..."
              gh release edit "$TAG" \
                --target "$GITHUB_SHA" \
                --title "Dual Front TD $TAG" \
                --draft=false \
                --latest || true
            else
              echo "Keeping release $TAG in current state (Draft/Staged) for commit $GITHUB_SHA."
            fi
          else
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Creating new DRAFT GitHub Release $TAG..."
              gh release create "$TAG" dist/* \
                --draft \
                --target "$GITHUB_SHA" \
                --title "Dual Front TD $TAG" \
                --generate-notes || {
                  echo "Draft release creation encountered conflict; uploading assets with --clobber..."
                  gh release upload "$TAG" dist/* --clobber
                }
            else
              echo "Explicit release command/tag detected: creating and publishing live GitHub Release $TAG..."
              gh release create "$TAG" dist/* \
                --target "$GITHUB_SHA" \
                --title "Dual Front TD $TAG" \
                --generate-notes || {
                  echo "Release creation encountered existing tag or conflict; uploading assets with --clobber..."
                  gh release upload "$TAG" dist/* --clobber
                }
            fi
          fi
          echo "Successfully processed release $TAG (Draft: $IS_DRAFT) for commit $GITHUB_SHA!"
